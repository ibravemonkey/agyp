id = "ibravemonkey.agyp"
name = "Antigravity Profiles (agyp)"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Multi-profile manager & real-time quota tracking for Antigravity"
platforms = ["macos", "linux", "windows"]

[[build]]
command = ["sh", "-c", "export PATH=\"$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH\"; command -v agyp >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/ibravemonkey/agyp/main/install.sh | bash; agyp herdr configure || true"]
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "-c", "export PATH=\"$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH\"; agyp herdr configure"]

[[panes]]
id = "quota"
title = "Antigravity Quota"
placement = "popup"
width = "85%"
height = 22
command = ["sh", "-c", "export PATH=\"$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH\"; agyp quota; printf '\\n\\033[90mPress [Enter] to close...\\033[0m'; read -r _"]
platforms = ["macos", "linux"]

[[actions]]
id = "quota"
title = "Check Quota Dashboard"
contexts = ["workspace", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "ibravemonkey.agyp", "--entrypoint", "quota"]

[[actions]]
id = "configure"
title = "Configure Clean 3-Row Sidebar"
command = ["agyp", "herdr", "configure"]

[[actions]]
id = "uninstall"
title = "Restore Default Sidebar"
contexts = ["workspace"]
command = ["agyp", "herdr", "uninstall"]

[[actions]]
id = "run-auto"
title = "Launch Best Profile (Auto)"
contexts = ["workspace"]
command = ["herdr", "pane", "split", "--", "agyp", "run", "auto"]

[[actions]]
id = "commit"
title = "AI Staged Commit"
contexts = ["workspace", "pane"]
command = ["agyp", "commit"]

[[events]]
id = "agyp-pane-focused"
on = "pane.focused"
command = ["agyp", "herdr-hook", "quota"]
